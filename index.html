<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rhys.fr</title>
  <style>
    :root {
      --bg: #eef2f6;
      --ink: #14202e;
      --muted: #5b6b7c;
      --accent: #1f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101820;
        --ink: #e8eef5;
        --muted: #8a9bad;
        --accent: #5aa2ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main { max-width: 36rem; }
    h1 {
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      margin: 0 0 1.2rem;
    }
    h1 span { color: var(--accent); }
    p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--muted);
      margin: 0;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world<span>.</span></h1>
    <p>Bienvenue sur rhys.fr. Le site est en ligne, le reste arrive bientôt.</p>
  </main>
</body>
</html>
